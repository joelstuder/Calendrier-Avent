<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="fond" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#4a2a16"/>
      <stop offset="0.6" stop-color="#22140b"/>
      <stop offset="1" stop-color="#120b07"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ead0"/>
      <stop offset="1" stop-color="#e2cc9c"/>
    </linearGradient>
    <linearGradient id="bande" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#951b20"/>
      <stop offset="1" stop-color="#6a1014"/>
    </linearGradient>
    <linearGradient id="anneau" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2420"/>
      <stop offset="0.5" stop-color="#8a8079"/>
      <stop offset="1" stop-color="#2b2420"/>
    </linearGradient>
    <filter id="ombre" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="coins"><rect x="88" y="104" width="336" height="336" rx="30"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#fond)"/>

  <!-- la page du calendrier -->
  <g filter="url(#ombre)">
    <rect x="88" y="104" width="336" height="336" rx="30" fill="url(#page)"/>
  </g>
  <g clip-path="url(#coins)">
    <rect x="88" y="104" width="336" height="92" fill="url(#bande)"/>
    <rect x="88" y="196" width="336" height="5" fill="#d4a845"/>
  </g>
  <rect x="88" y="104" width="336" height="336" rx="30" fill="none" stroke="#d4a845" stroke-width="4"/>

  <!-- petites étoiles dorées dans la bande -->
  <g fill="#d4a845">
    <path d="M256 128 l6 14 15 1 -11.5 9.5 3.5 14.5 -13 -8 -13 8 3.5 -14.5 -11.5 -9.5 15 -1z"/>
    <circle cx="200" cy="152" r="4"/>
    <circle cx="312" cy="152" r="4"/>
  </g>

  <!-- anneaux de reliure -->
  <g>
    <rect x="160" y="80" width="18" height="56" rx="9" fill="url(#anneau)" stroke="#1a1410" stroke-width="2"/>
    <rect x="334" y="80" width="18" height="56" rx="9" fill="url(#anneau)" stroke="#1a1410" stroke-width="2"/>
  </g>

  <!-- le K -->
  <text x="256" y="406" text-anchor="middle" font-family="Uncial Antiqua" font-size="196" fill="#7a1418" stroke="#3b2410" stroke-width="3" paint-order="stroke">K</text>
</svg>
